samples: "test/samples.tsv"
workflow:
  run_variant_calling: false
  run_phasing: false
  run_consensus: false
filtering:
  enabled: false
  min_length: 1
  max_length: 1000
  min_mean_q: 1
  keep_percent: 100
mapping:
  preset: "map-ont"
  threads: 2
  variant_min_mapq: 0
  phasing_min_mapq: 0
  phasing_min_length: 1
qc:
  core_depth_threshold: 1
clair3:
  require_target_regions: true
  threads: 2
  platform: "ont"
  model_path: "/not/used/in/core-test"
  executable: "run_clair3.sh"
  extra: ""
phasing:
  threads: 2
