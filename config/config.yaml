# Long-range ONT amplicon pipeline v0.3
samples: "config/samples.tsv"

workflow:
  # Keep disabled until the correct Clair3 ONT model is configured and
  # the cleaned mapping/QC outputs have been reviewed.
  run_variant_calling: false
  run_phasing: false
  run_consensus: false

# Optional FASTQ-level filtering. Raw input is never modified.
filtering:
  enabled: false
  min_length: 1000
  max_length: 30000
  min_mean_q: 8
  keep_percent: 100

mapping:
  preset: "map-ont"
  threads: 8

  # Small-variant BAM: primary + mapped + MAPQ >= this threshold.
  variant_min_mapq: 30

  # Phasing BAM: same cleanup, but long-read enriched.
  phasing_min_mapq: 30
  phasing_min_length: 8000

qc:
  # Used to find contiguous high-depth intervals in each cleaned amplicon BAM.
  # Can be overridden per amplicon in config/samples.tsv.
  core_depth_threshold: 20

clair3:
  threads: 8
  platform: "ont"
  model_path: "/path/to/clair3_models/ont"
  executable: "run_clair3.sh"
  extra: ""

phasing:
  threads: 4
