# Long-range ONT amplicon pipeline v0.2
samples: "config/samples.tsv"

workflow:
  # Start with the core workflow. Enable these after mapping/QC is validated
  # and the correct Clair3 model has been configured.
  run_variant_calling: false
  run_phasing: false
  run_consensus: false

filtering:
  enabled: false
  min_length: 1000
  max_length: 30000
  min_mean_q: 8
  keep_percent: 100

mapping:
  preset: "map-ont"
  threads: 8

clair3:
  threads: 8
  platform: "ont"
  model_path: "/path/to/clair3_models/ont"
  executable: "run_clair3.sh"
  extra: ""

phasing:
  threads: 4
