# Long-range ONT amplicon pipeline v0.6
samples: "config/samples.tsv"

workflow:
  # v0.6 adds validated haplotagging, haplotype-specific support QC,
  # uncertainty masking and reference-guided haplotype reconstruction.
  run_variant_calling: true
  run_phasing: true
  run_haplotype_reconstruction: true
  run_consensus: true

# Optional FASTQ-level filtering. Raw input is never modified.
filtering:
  enabled: false
  min_length: 1000
  max_length: 30000
  min_mean_q: 8
  keep_percent: 100

mapping:
  preset: "map-ont"
  threads: 8

  # Small-variant BAM: primary + mapped + MAPQ >= this threshold.
  variant_min_mapq: 30

  # Phasing BAM: same cleanup, but long-read enriched.
  phasing_min_mapq: 30
  phasing_min_length: 8000

qc:
  # Used to find contiguous high-depth intervals in each cleaned amplicon BAM.
  # Can be overridden per amplicon in config/samples.tsv.
  core_depth_threshold: 20

clair3:
  # Safety default for targeted amplicon workflows.
  require_target_regions: true
  threads: 8
  platform: "ont"
  model_name: "r1041_e82_400bps_hac_v520"
  executable: "run_clair3.sh"
  extra: "--var_pct_full=1 --ref_pct_full=1 --var_pct_phasing=1 --enable_variant_calling_at_sequence_head_and_tail"

phasing:
  threads: 4

haplotypes:
  threads: 4

  # A base is callable for haplotype consensus only if the corresponding
  # haplotype BAM reaches this depth. Low-depth bases are masked with N.
  callable_min_depth: 50

  # Exact REF/ALT support is measured from HP1/HP2 reads. These are validation-
  # derived, configurable safeguards rather than universal biological cutoffs.
  min_support_depth: 20
  min_het_alt_fraction: 0.30
  min_het_delta: 0.25
  min_hom_alt_fraction: 0.80
  max_other_fraction: 0.25
  require_pass: true

  # Raised above samtools mpileup's small default so deep amplicon data are not
  # downsampled during support assessment.
  mpileup_max_depth: 100000
