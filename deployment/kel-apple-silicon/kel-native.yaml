# Standalone native core/controller environment; Clair3 needs a separate env.
# The historical explicit lock predates reporting and is retained unchanged.
# This readable specification adds openpyxl; a fresh solve has not been tested.
# For the lock-based setup, install the pinned reporting wheels as in README.md.
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12.14
  - snakemake-minimal=9.27.0
  - minimap2=2.31
  - samtools=1.24
  - pysam=0.24.1
  - nanoplot=1.48.0
  - filtlong=0.3.1
  - gzip=1.14
  - bcftools=1.24
  - htslib=1.24
  - whatshap=2.8
  - openpyxl=3.1.5
